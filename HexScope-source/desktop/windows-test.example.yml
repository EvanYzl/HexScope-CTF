name: Windows 构建与回归

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: HexScope-source
        shell: pwsh
    steps:
      - name: 取得源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置开发用 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HexScope-source/package-lock.json
      - name: 安装锁定的测试依赖
        run: npm ci --ignore-scripts
      - name: 重建并执行完整回归
        run: npm test
