<div id="previewPanel" class="tab-panel" role="tabpanel" hidden>
 <div class="preview-heading"><div><strong>文件预览</strong><span id="previewFormat" class="tag info"></span><span id="previewSource" class="tag info"></span></div><div class="button-group"><button id="previewReload" class="secondary">重新载入</button><button id="previewStop" class="quiet" disabled>停止预览</button></div></div>
 <p id="previewStatus" role="status" class="panel-intro">选择文件后在本机只读预览。</p>
 <div id="previewTools" class="preview-tools"></div>
 <form id="previewPasswordForm" class="preview-tools" hidden><label>PDF 密码 <input id="previewPassword" type="password" autocomplete="off" aria-label="PDF 密码"></label><button type="submit" class="primary">解锁预览</button><small>密码仅用于当前预览。</small></form>
 <div id="previewStage" class="preview-stage"></div>
 <p id="previewNote" class="preview-note">支持 DOCX、Excel、PDF、图片、文本和部分音视频格式。解析失败或显示不全时，仍可查看十六进制与提取文件。</p>
</div>
